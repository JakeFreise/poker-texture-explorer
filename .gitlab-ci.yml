stages:
  - deploy

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public/flop-explorer
    - cp -r texture_outs_nut_potential_app/. public/flop-explorer/
    - cp *.png public/ 2>/dev/null || true
    - cp index.html public/index.html
    - cp -r portfolio public/portfolio
    - cp -r skyline public/skyline
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
